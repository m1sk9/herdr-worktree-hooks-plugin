name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test
        run: cargo test --verbose

      # herdr reads its own version out of herdr-plugin.toml, so a drift between
      # the two would ship a plugin that reports a version it was not built from.
      # release-please keeps them in step; this fails loudly if that ever breaks.
      - name: Check the plugin manifest version matches Cargo.toml
        run: |
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          plugin_version="$(grep -m1 '^version = ' herdr-plugin.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$plugin_version" ]; then
            echo "::error::Cargo.toml is $crate_version but herdr-plugin.toml is $plugin_version"
            exit 1
          fi
          echo "both report $crate_version"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Why not nightly: the crate carries no `coverage(off)` attributes, so
      # there is nothing here that needs the `coverage_nightly` cfg. The
      # untestable process glue is excluded through codecov.yml instead.
      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  # `herdr plugin install` clones this repository and runs the manifest's
  # `[[build]]` on the user's machine, so what has to hold is that a release
  # build succeeds on the platforms herdr-plugin.toml claims support for.
  # Why no windows or musl target: the manifest declares macos and linux only,
  # and the code is Unix-only (it shells out with `-c` and defaults to /bin/sh).
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      - name: Build as `herdr plugin install` would
        run: cargo build --release --verbose --target ${{ matrix.target }}
