name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test
        run: cargo test --verbose

      # scripts/install.sh runs as [[build]] on every `herdr plugin install`,
      # unreviewed by anyone but its author until it breaks someone's install.
      - name: Run shellcheck on scripts/install.sh
        run: shellcheck scripts/install.sh

      # herdr reads its own version out of herdr-plugin.toml, so a drift between
      # the two would ship a plugin that reports a version it was not built from.
      # release-please keeps them in step; this fails loudly if that ever breaks.
      - name: Check the plugin manifest version matches Cargo.toml
        run: |
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          plugin_version="$(grep -m1 '^version = ' herdr-plugin.toml | cut -d'"' -f2)"
          if [ "$crate_version" != "$plugin_version" ]; then
            echo "::error::Cargo.toml is $crate_version but herdr-plugin.toml is $plugin_version"
            exit 1
          fi
          echo "both report $crate_version"

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Why not nightly: the crate carries no `coverage(off)` attributes, so
      # there is nothing here that needs the `coverage_nightly` cfg. The
      # untestable process glue is excluded through codecov.yml instead.
      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  # `herdr plugin install` no longer compiles anything on the user's machine —
  # scripts/install.sh downloads a prebuilt archive instead (see release.yaml's
  # `assets` job), so this job's role shifted: guard that every target that
  # job ships still compiles cleanly on every PR, ahead of a real release.
  # Why no windows target: the manifest declares macos and linux only, and the
  # code is Unix-only (it shells out with `-c` and defaults to /bin/sh).
  build:
    name: build (${{ matrix.job.target }})
    runs-on: ${{ matrix.job.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        job:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "herdr-worktree-hooks-plugin/gh-actions-cache"

      # note: In Ubuntu-latest (Ubuntu 24), musl-tools has disappeared, so it
      # must be installed separately. aarch64 musl fails to link without it too.
      - name: Install musl-gcc
        if: contains(matrix.job.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build as release.yaml's `assets` job would
        run: cargo build --release --verbose --target ${{ matrix.job.target }}
